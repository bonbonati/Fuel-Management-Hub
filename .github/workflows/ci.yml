# CI (quality gate) for development: pushes to dev and PRs into dev/main run
# unit tests, the web build, k8s overlay validation and the docker compose
# end-to-end suite. Delivery to production is cd.yml (on main).
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - run: go vet ./... && go vet -tags e2e ./e2e/
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26 }
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @petro/web build

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render and validate overlays (strict schema check, no cluster needed)
        run: |
          for o in dev prod; do
            kubectl kustomize deploy/k8s/overlays/$o > /tmp/$o.yaml
            docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.34.0 /m/$o.yaml
          done

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: End-to-end tests
        run: cd backend && go test -count=1 -tags e2e ./e2e/ -v
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
