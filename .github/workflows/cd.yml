# CD (GitOps): on every push to main, build the six images, push them to the
# registry tagged with the commit SHA, then pin those tags in
# deploy/k8s/overlays/prod/kustomization.yaml and commit that back to main.
# Argo CD watches deploy/k8s/overlays/prod on main and rolls the cluster out.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   variables.REGISTRY            e.g. registry.example.com/petro  (images: $REGISTRY/<service>:<sha>)
#   secrets.REGISTRY_USERNAME     registry login
#   secrets.REGISTRY_PASSWORD     registry password / token
# Until REGISTRY is set, the workflow is skipped with a notice.
name: cd

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/k8s/overlays/prod/kustomization.yaml'] # our own tag bumps
  workflow_dispatch:

permissions:
  contents: write # commit the image tag bump

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  registry-not-set:
    if: vars.REGISTRY == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::REGISTRY repository variable is not set; skipping image build/push and tag bump."

  build-push:
    if: vars.REGISTRY != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: auth,    context: backend,  file: backend/Dockerfile,           args: SERVICE=auth }
          - { name: fleet,   context: backend,  file: backend/Dockerfile,           args: SERVICE=fleet }
          - { name: station, context: backend,  file: backend/Dockerfile,           args: SERVICE=station }
          - { name: payment, context: backend,  file: backend/Dockerfile,           args: SERVICE=payment }
          - { name: fueling, context: backend,  file: backend/Dockerfile,           args: SERVICE=fueling }
          - { name: web,     context: frontend, file: frontend/apps/web/Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: ${{ vars.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bump-tags:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Install kustomize
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Pin images to ${{ github.sha }}
        working-directory: deploy/k8s/overlays/prod
        run: |
          for s in auth fleet station payment fueling web; do
            kustomize edit set image "petro/$s=${{ vars.REGISTRY }}/$s:${{ github.sha }}"
          done
          kustomize build . > /dev/null   # still renders
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "deploy(prod): images ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
