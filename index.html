<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Petro App Prototype</title>

<style>
/* PetroFleet Mobility, bright edition. Single light look by design: airy blue-grey canvas, white cards,
   multi-colour accents (emerald = driver/primary, blue = fleet, orange = station, violet/cyan = data).
   Layout: top bar; app mode = phone on canvas with notes; web mode = sidebar admin console. RTL-first. */
:root{
  color-scheme:light;
  --canvas:#EEF3F9; --s1:#FFFFFF; --s2:#F2F5FA; --stroke:#D8E0EC;
  --ink:#273449; --white:#0B1526; --muted:#5D6B80; --faint:#8C99AC;
  --em:#00A86B; --em-d:#007F51; --em-ink:#FFFFFF; --em-soft:#DDF7EC; --em-press:#00925D;
  --bl:#2F6BFF; --bl-d:#1F4FD1; --bl-soft:#E4ECFF;
  --or:#F97316; --or-d:#C2550B; --or-soft:#FFEEDB;
  --vi:#7C5CFF; --vi-d:#5B3DE0; --vi-soft:#EEEAFF;
  --cy:#0891B2; --cy-soft:#DDF4FA;
  --am:#B86E00; --am-f:#F59E0B; --am-soft:#FEF2D6;
  --rd:#D92D20; --rd-soft:#FDE6E4;
  --g91:#15803D; --g91-bg:#DCFCE7; --g95:#B42318; --g95-bg:#FEE4E2; --gdz:#9A6700; --gdz-bg:#FEF3C7;
  --head:"Space Grotesk","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"Inter","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Sans Arabic",ui-monospace,Menlo,monospace;
  --r-sm:8px; --r-lg:16px; --r-xl:24px;
  --rc:var(--em); --rc-d:var(--em-d); --rc-soft:var(--em-soft);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
[lang="ar"] body{font-family:"IBM Plex Sans Arabic","Inter",Tahoma,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--white)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.cap{font-size:.62em;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-inline-start:4px;font-family:var(--body)}
.lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
[lang="ar"] .lbl{letter-spacing:0;font-size:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
h1,h2,h3{font-family:var(--head)}
[data-r="fleet"]{--rc:var(--bl);--rc-d:var(--bl-d);--rc-soft:var(--bl-soft)}
[data-r="station"]{--rc:var(--or);--rc-d:var(--or-d);--rc-soft:var(--or-soft)}
.topbar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{font-family:var(--head);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;margin-inline-end:auto;color:var(--white)}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--em),var(--cy));display:grid;place-items:center;color:#fff}
.seg{display:flex;background:var(--s1);border:1px solid var(--stroke);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--white);color:#fff;font-weight:700}
.roles button[data-role="driver"][aria-pressed="true"]{background:var(--em)}
.roles button[data-role="fleet"][aria-pressed="true"]{background:var(--bl)}
.roles button[data-role="station"][aria-pressed="true"]{background:var(--or)}
.lang{padding:8px 14px;border-radius:999px;border:1px solid var(--stroke);background:var(--s1);font-weight:700;font-size:13px;color:var(--white);min-height:36px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--em-d);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.pulse{box-shadow:0 0 0 0 rgba(0,168,107,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(0,168,107,0)}100%{box-shadow:0 0 0 0 rgba(0,168,107,0)}}
@media (max-width:640px){.brand{width:100%}}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px minmax(0,1fr);gap:28px;align-items:start}
.notes{padding-top:56px;min-width:0}
.notes h1{font-weight:700;font-size:32px;line-height:1.15;margin:0 0 12px;color:var(--white);text-wrap:balance}
.notes p{color:var(--muted);line-height:1.65;margin:0 0 14px;max-width:36ch}
.notes .lbl{display:block;margin-bottom:12px;color:var(--em-d)}
.swatches{display:flex;gap:6px;margin-top:6px}.swatches i{width:22px;height:8px;border-radius:4px}
.center{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:0}
.side{padding-top:56px;min-width:0}
.side h3{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}
.side ol{margin:0;padding-inline-start:18px;color:var(--muted);line-height:1.7}
.side li b{color:var(--white);font-weight:600}
@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}.notes,.side{padding-top:0;max-width:400px;margin:0 auto;width:100%}.center{order:1}.side{order:2}}
.roles{width:100%;max-width:400px}.roles button{flex:1}
.phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 140px));min-height:620px;background:var(--canvas);border:1px solid var(--stroke);
  border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 60px -30px rgba(31,79,209,.35),0 0 0 6px #fff}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;scrollbar-width:none}
.appbar{display:flex;align-items:center;gap:10px;padding:16px 0 12px;position:sticky;top:0;background:var(--canvas);z-index:2}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl small{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--rc-d)}
.appbar .ttl b{display:block;font-family:var(--head);font-size:20px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--ink);position:relative;flex-shrink:0}
.iconbtn .badge-dot{position:absolute;top:9px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--or)}
.ava{width:44px;height:44px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.ava.sm{width:36px;height:36px;font-size:12px}
.dock{display:flex;align-items:flex-end;background:var(--s1);border-top:1px solid var(--stroke);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 6px 12px}
.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px}
.dock button svg{width:22px;height:22px}
.dock button[aria-current="true"]{color:var(--rc-d)}
.dock .qr{flex:0 0 72px}
.dock .qr span.c{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--em),var(--cy));color:#fff;display:grid;place-items:center;margin-top:-28px;box-shadow:0 0 0 6px var(--canvas),0 8px 20px rgba(0,168,107,.35)}
.dock .qr span.c svg{width:26px;height:26px}
.card{background:var(--s1);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:16px}
.card+.card,.card+.sec,.sec+.card,.sec+.sec,.stack>*+*{margin-top:12px}
.g2>*,.g3>*,.wk>*,.grid2>*,.main>*,.row>*{margin-top:0!important}
.inset,.deep{background:var(--s2);border:1px solid var(--stroke);border-radius:12px;padding:12px}
.hero{border:0;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2))}
.h-em{--h1:#00A86B;--h2:#0891B2} .h-bl{--h1:#2F6BFF;--h2:#7C5CFF} .h-or{--h1:#F97316;--h2:#E8436E} .h-vi{--h1:#7C5CFF;--h2:#2F6BFF}
.hero .lbl,.hero .muted,.hero .cap{color:rgba(255,255,255,.85)}
.hero .w,.hero b,.hero h2,.hero h3,.hero .em,.hero .big{color:#fff}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.hero .quota{background:rgba(255,255,255,.3)} .hero .quota i{background:#fff}
.hero .deep,.hero .inset{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
.hero .btn-s{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.hero .btn-p{background:#fff;color:var(--white)}
.hero .ico{background:rgba(255,255,255,.2);color:#fff}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h3{margin:0;font-size:18px;font-weight:600;color:var(--white);display:flex;align-items:center;gap:8px}
.sec{margin-top:18px}
.sec>.lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec>.lbl button{color:var(--bl-d);font-weight:700}
.btn-p{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;background:var(--em);color:var(--em-ink);font-weight:700;font-size:16px;border-radius:var(--r-sm);padding:0 16px}
.btn-p:active{background:var(--em-press)}
.btn-p:disabled{opacity:.4;cursor:not-allowed}
.btn-s{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;background:var(--s1);border:1px solid var(--stroke);color:var(--white);font-weight:600;border-radius:var(--r-sm);padding:0 14px}
.btn-c{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;background:var(--rd-soft);border:1px solid rgba(217,45,32,.35);color:var(--rd);font-weight:700;border-radius:var(--r-sm);padding:0 14px}
.btn-sm{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-sm);font-weight:700;font-size:13px;background:var(--s1);border:1px solid var(--stroke);color:var(--white);white-space:nowrap}
.btn-sm.p{background:var(--em);border-color:var(--em);color:#fff}
.btn-sm.b{background:var(--bl-soft);border-color:transparent;color:var(--bl-d)}
.link{color:var(--bl-d);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.row{display:flex;gap:8px} .row>*{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--s2);color:var(--muted)}
.pill.em{background:var(--em-soft);color:var(--em-d)} .pill.am{background:var(--am-soft);color:var(--am)} .pill.rd{background:var(--rd-soft);color:var(--rd)} .pill.cy{background:var(--cy-soft);color:var(--cy)} .pill.bl{background:var(--bl-soft);color:var(--bl-d)} .pill.vi{background:var(--vi-soft);color:var(--vi-d)} .pill.or{background:var(--or-soft);color:var(--or-d)}
.fg{font-weight:700;font-size:11px;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.fg91{color:var(--g91);background:var(--g91-bg)} .fg95{color:var(--g95);background:var(--g95-bg)} .fgdz{color:var(--gdz);background:var(--gdz-bg)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--white);background:#fff;border-radius:6px;overflow:hidden;font-family:var(--mono);font-weight:700;font-size:12px;direction:ltr;vertical-align:middle;color:var(--white);line-height:1.2}
.plate span{padding:3px 7px;display:flex;flex-direction:column;justify-content:center}
.plate span+span{border-left:1.5px solid var(--white);font-family:"IBM Plex Sans Arabic",var(--mono)}
.quota{height:6px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:8px}
.quota i{display:block;height:100%;border-radius:6px;background:var(--em)}
.quota i.am{background:var(--am-f)} .quota i.rd{background:var(--rd)}
.big{font-family:var(--mono);font-weight:700;font-size:32px;color:var(--white);line-height:1.1;margin:6px 0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--s2);min-width:0}
.li:last-child{border-bottom:0;padding-bottom:0}.li:first-child{padding-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{color:var(--muted);font-size:12px}
.li .r{text-align:end;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--em-soft);display:grid;place-items:center;flex-shrink:0;color:var(--em-d)}
.ico.am{color:var(--am);background:var(--am-soft)} .ico.rd{color:var(--rd);background:var(--rd-soft)} .ico.cy{color:var(--cy);background:var(--cy-soft)} .ico.bl{color:var(--bl-d);background:var(--bl-soft)} .ico.or{color:var(--or-d);background:var(--or-soft)} .ico.vi{color:var(--vi-d);background:var(--vi-soft)}
.muted{color:var(--muted)} .em{color:var(--em-d)} .am{color:var(--am)} .rd{color:var(--rd)} .cy{color:var(--cy)} .bl{color:var(--bl-d)} .or{color:var(--or-d)} .vi{color:var(--vi-d)} .w{color:var(--white)}
.note{border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.rd{background:var(--rd-soft);color:var(--rd)} .note.am{background:var(--am-soft);color:var(--am)} .note.em{background:var(--em-soft);color:var(--em-d)}
input.field,select.field{width:100%;min-height:48px;padding:0 14px;background:var(--s1);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--white)}
input.field::placeholder{color:var(--faint)}
input.field:focus,select.field:focus{border-color:var(--bl);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chipsel{min-height:36px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--stroke);color:var(--muted);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chipsel[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
.chipsel:disabled{opacity:.35;cursor:not-allowed}
.sel{box-shadow:0 0 0 2px var(--rc),0 8px 20px -8px var(--rc);border-color:transparent!important}
.qrbox{background:var(--s2);border:1px solid var(--stroke);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
.qrbox canvas{width:196px;height:196px;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(11,21,38,.08)}
.qrbox .lock{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--am);font-weight:600}
.qrmeta{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12px}
.sheet-bg{position:absolute;inset:0;background:rgba(11,21,38,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--s1);width:100%;max-height:92%;overflow-y:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 18px 22px}
.grab{width:40px;height:4px;background:var(--stroke);border-radius:4px;margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:700;margin:0 0 4px;color:var(--white)}
.sub{color:var(--muted);margin:0 0 14px}
.steps{display:flex;gap:4px;margin-bottom:14px} .steps i{flex:1;height:4px;border-radius:4px;background:var(--stroke)} .steps i.on{background:linear-gradient(90deg,var(--em),var(--cy))}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opts.c3{grid-template-columns:repeat(3,1fr)} .opts.c4{grid-template-columns:repeat(4,1fr)}
.opt{border:1px solid var(--stroke);border-radius:12px;padding:12px;text-align:start;background:var(--s1);min-height:48px}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt[aria-pressed="true"]{border-color:var(--em);box-shadow:inset 0 0 0 1px var(--em);background:var(--em-soft)}
.opt.pump{text-align:center;font-family:var(--mono);font-weight:700;font-size:20px;padding:10px 0;color:var(--white)}
.opt b{color:var(--white)}
.opt small{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-family:var(--body);font-weight:500}
.amount{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:10px 0 4px;direction:ltr}
.amount input{width:200px;text-align:center;font-family:var(--mono);font-weight:700;font-size:36px;border:0;border-bottom:2px solid var(--stroke);background:transparent;color:var(--em-d)}
.amount input:focus{outline:none;border-color:var(--em)}
.sum{padding:4px 14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--stroke)}
.sum div:last-child{border:0;font-weight:700;color:var(--white)} .sum span:first-child{color:var(--muted)}
.success{text-align:center;padding:10px 0}
.tick{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--em),var(--cy));color:#fff;display:grid;place-items:center;margin:6px auto 12px}
.code{font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:.3em;padding:12px;background:var(--s2);border:1px solid var(--stroke);border-radius:12px;margin:12px 0;direction:ltr;color:var(--vi-d);text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.keypad button{min-height:48px;border-radius:var(--r-sm);background:var(--s1);border:1px solid var(--stroke);font-family:var(--mono);font-weight:700;font-size:18px;color:var(--white)}
.toast{position:fixed;inset-inline:0;margin-inline:auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);background:var(--white);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;text-align:center;box-shadow:0 8px 24px rgba(11,21,38,.25)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.tiny{font-size:11px;color:var(--faint);margin-top:14px;text-align:center}
.toggle{appearance:none;width:48px;height:28px;border-radius:999px;background:#CBD5E1;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.toggle:checked{background:var(--em)} .toggle:checked::after{inset-inline-start:23px}
.rule{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--s2)} .rule:last-child{border:0;padding-bottom:0} .rule:first-child{padding-top:0}
.rule .t{flex:1;min-width:0} .rule b{display:block;color:var(--white);font-weight:600} .rule span{color:var(--muted);font-size:12px}
.alertc{display:flex;gap:12px;align-items:flex-start}
.alertc p{margin:4px 0 0;color:var(--ink);font-size:13px;line-height:1.5}

/* QR (illustrative pattern seeded by the token) */
function drawQR(){
 const c=document.getElementById('qrc');if(!c)return;
 const n=29,px=196,dpr=window.devicePixelRatio||1;c.width=px*dpr;c.height=px*dpr;
 let x=null;try{x=c.getContext('2d')}catch(e){}if(!x)return;x.scale(dpr,dpr);x.fillStyle='#fff';x.fillRect(0,0,px,px);
 let h=0;for(const ch of S.qr.token)h=(h*31+ch.charCodeAt(0))>>>0;
 const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%1000)/1000};
 const m=(px-16)/n,o=8;x.fillStyle='#0B1526';
 const finder=(cx,cy)=>{x.fillRect(o+cx*m,o+cy*m,7*m,7*m);x.fillStyle='#fff';x.fillRect(o+(cx+1)*m,o+(cy+1)*m,5*m,5*m);x.fillStyle='#0B1526';x.fillRect(o+(cx+2)*m,o+(cy+2)*m,3*m,3*m)};
 const inF=(i,j)=>(i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9)||(i>11&&i<17&&j>11&&j<17);
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(inF(i,j))continue;if(rnd()>.52)x.fillRect(o+i*m,o+j*m,Math.ceil(m),Math.ceil(m))}
 finder(0,0);finder(n-7,0);finder(0,n-7);
 x.fillStyle='#00A86B';x.fillRect(o+12.4*m,o+12.4*m,4.2*m,4.2*m);
 x.fillStyle='#fff';x.beginPath();x.arc(px/2,px/2+2,5,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(px/2-5,px/2);x.lineTo(px/2,px/2-9);x.lineTo(px/2+5,px/2);x.fill();
}

function openPay(){const blk=driverBlock();if(blk){toast(blk.msg);return}if(odoLocked()){toast(T('سجّل قراءة العدّاد أولاً','Record the odometer reading first'));return}
 const v=myVeh();S.flow={step:1,station:null,pump:null,fuel:v.fuel,amount:200000};S.sheet='pay';render()}
function capMsg(over,cap,why){
 if(!over)return `${T('المتاح','Available')}: ${curTxt(cap)}`;
 if(why==='perfill')return T(`الحد الأقصى للتعبئة الواحدة وفق سياسة الشركة: ${curTxt(cap)}`,`Company policy caps a single fill-up at ${curTxt(cap)}`);
 return T(`المبلغ يتجاوز المتاح لك (${curTxt(cap)})`,`The amount exceeds your available ${curTxt(cap)}`);
}
function paySheet(){
 const F=S.flow,v=myVeh(),{cap,why}=capFor(v);
 const steps=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=F.step?'on':''}"></i>`).join('')}</div>`;
 const back=`<button class="btn-s" data-act="back">${T('رجوع','Back')}</button>`;

  return `${steps}<h3>${T('اختر المضخة','Choose a pump')}</h3><p class="sub">${esc(N(s.name))} · ${T('رقم المضخة مكتوب عليها.','The number is shown on the pump.')}</p>
  <div class="opts c4">${Array.from({length:s.pumps},(_,i)=>i+1).map(n=>{const p=s.id===MY?pumpOf(n):null,off=p&&(!p.on||!p.grades.includes(F.fuel));return `<button class="opt pump" data-act="pp:${n}" aria-pressed="${F.pump===n}" ${off?'disabled':''}>${n}${p&&!p.on?`<small>${T('متوقفة','Offline')}</small>`:off?`<small>${T('وقود مختلف','Other grade')}</small>`:''}</button>`}).join('')}</div>

 return `<div class="success"><div class="tick">${ic('check',32)}</div><h3>${T('المضخة','Pump')} <span class="num">${F.pump}</span> ${T('جاهزة للتعبئة','is ready')}</h3>

function confirmPay(){
 const F=S.flow,v=myVeh(),id='T-'+(90413+S.tx.length),code=String(1000+Math.floor(Math.random()*9000)),hm=nowHM();

/* ---------- FLEET ---------- */
function fleetTotals(){const lim=S.fleet.reduce((a,f)=>a+limOf(f),0),used=S.fleet.reduce((a,f)=>a+f.used,0);
 return {lim,used,pct:used/Math.max(1,lim)*100,litres:S.fleet.reduce((a,f)=>a+f.used/PRICES[f.fuel],0)}}
const WEEKS=()=>{const {used}=fleetTotals();return [1230000,1590000,1470000,Math.max(0,Math.round(used-4290000))]};
function tierStats(t){const vs=S.fleet.filter(f=>f.tier===t.id),budget=vs.reduce((a,f)=>a+limOf(f),0),spent=vs.reduce((a,f)=>a+f.used,0);
 return {vs,budget,spent,remain:Math.max(0,budget-spent),pct:spent/Math.max(1,budget)*100,extra:vs.reduce((a,f)=>a+(f.extra||0),0)}}
function fleetAlerts(){

function saveModal(){
 const {type,id}=S.modal,M=MODALS[type],o=id==='new'?null:M.get(id),vals={},form=$('#mform'),err=$('#merr');
 for(const x of M.fields(o)){const fid='mf-'+x.k;

  else{const el=$('#'+fid);vals[x.k]=el.value.trim();if(!el.checkValidity()||(x.req&&!vals[x.k])){err.textContent=T(`يرجى مراجعة حقل «${x.l}»`,`Please check the "${x.l}" field`)+(x.hint?` · ${x.hint}`:'');err.hidden=false;el.focus();return}}}
 const r=M.save(vals,o);
 if(r&&r.err){err.textContent=r.err;err.hidden=false;return}
 S.modal=null;toast(r);
}

/* request decisions */
function decide(id,ok){
 const r=S.requests.find(x=>x.id===id);if(!r||r.status!=='pending')return;
 const note=(($('#rn-'+id)||{}).value||'').trim(),d=drv(r.driver),f=r.veh?fv(r.veh):null,hm=nowHM();
 if(ok&&r.type==='limit'){const a=+(($('#ra-'+id)||{}).value||r.amount);if(!(a>=10000)){toast(T('أدخل مبلغاً معتمداً لا يقل عن 10,000 ج.س','Enter an approved amount of at least SDG 10,000'));return}if(!f){toast(T('لا توجد مركبة مرتبطة بهذا الطلب','No vehicle is linked to this request'));return}f.extra=(f.extra||0)+a;r.approved=a}
 if(ok&&r.type==='activate'){if(d)d.active=true;if(f)f.active=true}
 r.status=ok?'approved':'rejected';r.decided=W('اليوم '+hm,'Today '+hm);r.reply=W(note,note);
 toast(ok?(r.type==='limit'?T(`تم اعتماد ${curTxt(r.approved)} لـ ${d?d.name.ar:''}`,`${curTxt(r.approved)} approved for ${d?d.name.en:''}`):T(`تمت إعادة تفعيل ${d?d.name.ar:''}`,`${d?d.name.en:''} reactivated`)):T('تم رفض الطلب وإشعار السائق','Request declined and driver notified'));
}

  const r=S.role,t=S.tab[r],sc=$('#screen');
  sc.innerHTML=VIEWS[r][t]();sc.dataset.view=r+t;sc.scrollTop=keep;
  const badge=k=>{if(r==='fleet'&&k==='requests'){const n=pendingReqs().length;return n?`<span class="nbadge">${n}</span>`:''}if(r==='driver'&&k==='requests'){const n=myReqs().filter(x=>x.status==='pending').length;return n?`<span class="nbadge">${n}</span>`:''}return ''};
  $('#nav').innerHTML=NAVS[r]().map(([k,l,i])=>k==='QR'?`<button class="qr" data-act="pay" aria-label="${l}"><span class="c">${ic(i)}</span>${l}</button>`:`<button data-act="tab:${k}" aria-current="${k===t}">${badge(k)}${ic(i)}${l}</button>`).join('');
  if(S.sheet){const bg=document.createElement('div');bg.className='sheet-bg';bg.dataset.act='bgclose';
   bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${S.sheet==='pay'?paySheet():reqSheet()}</div>`;$('#phone').appendChild(bg)}
  drawQR();
 }
 document.querySelectorAll('.toast').forEach(e=>e.remove());
 if(S.toast){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=S.toast;document.body.appendChild(d)}
}

/* ---------- events ---------- */
function logSec(c,t,d,ref){S.secLog.unshift({c,t,d,ago:W('الآن','Just now'),ref})}
function doScan(kind){
 if(kind==='qr'){
  const d=me(),v=myVeh();
  if(!v){toast(T('لا توجد مركبة مخصصة لهذا السائق','No vehicle is assigned to this driver'));return}
  if(odoLocked()&&d.active&&v.active){toast(T('تصريح السائق غير مفعّل: لم تُسجَّل قراءة العدّاد بعد.','Driver pass inactive: odometer not recorded yet.'));return}
  if(S.rules.network&&!S.network.includes(MY)){toast(T('المحطة خارج شبكة الشركة','This station is not in the company network'));return}
  S.scan={src:'qr',fid:v.id,token:S.qr.token,mode:'sar',sar:200000,lit:40,pump:null};
  if(!d.active)logSec('rd',W('محاولة تعبئة من سائق موقوف','Fueling attempt by a suspended driver'),W(`حاول ${d.name.ar} التعبئة في ${stn(MY).name.ar} أثناء إيقاف حسابه، فمُنعت العملية.`,`${d.name.en} attempted to fuel at ${stn(MY).name.en} while suspended. The attempt was blocked.`),d.code);
  else if(!v.active)logSec('rd',W('محاولة تعبئة لمركبة موقوفة','Fueling attempt on a suspended vehicle'),W(`مُسح رمز المركبة الموقوفة ${v.plate[0]} في ${stn(MY).name.ar}، فمُنعت العملية.`,`The code for suspended vehicle ${v.plate[0]} ${v.plate[1]} was scanned at ${stn(MY).name.en}. The attempt was blocked.`),v.plate.slice(0,2).join('-'));
  toast(T('تم التعرّف على السائق من رمز التصريح','Driver identified from the pass code'));return;
 }
 const f=fv('f6')||S.fleet[0];S.scan={src:'rfid',fid:f.id,mode:'lit',sar:200000,lit:60,pump:null};
 toast(T(`تمت قراءة الشريحة: ${f.name.ar}`,`Tag read: ${f.name.en}`));
}
function doDispense(){
 const I=scanInfo(),sc=S.scan,amt=sc.mode==='lit'?Math.round(sc.lit*PRICES[I.fuel]):sc.sar,hm=nowHM();
 S.tx.unshift({id:'T-'+(90413+S.tx.length),who:I.src==='qr'?'driver':'other',fleetId:I.f.id,station:MY,pump:sc.pump,fuel:I.fuel,amount:amt,status:'fueling',when:W('الآن '+hm,'Now '+hm),src:I.src});
 charge(I.f.id,amt);const p=sc.pump;S.scan=null;toast(T(`بدأ الصرف من المسدس ${p}`,`Nozzle ${p} is dispensing`));
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act],[data-role]');if(!el)return;
 if(el.dataset.role){S.role=el.dataset.role;S.sheet=null;S.hubBack=null;if(S.tab[S.role]==='hub'||S.tab[S.role]==='vehicle')S.tab[S.role]=Object.keys(VIEWS[S.role])[0];render();return}
 const parts=el.dataset.act.split(':'),a=parts[0],v=parts.slice(1).join(':');
 if(a==='bgclose'||a==='mbg'){if(e.target===el){S.sheet=null;S.modal=null;render()}return}
 const F=S.flow;
 switch(a){
  case 'lang':S.lang=S.lang==='ar'?'en':'ar';try{localStorage.setItem('petro-lang',S.lang)}catch(_){}break;
  case 'mode':S.mode=v;S.sheet=null;S.modal=null;window.scrollTo(0,0);break;
  case 'portal':S.portal=v;break;
  case 'wtab':S.wtab[S.portal]=v;window.scrollTo(0,0);break;
  case 'modal':{const i=v.indexOf(':');S.modal={type:v.slice(0,i),id:v.slice(i+1)};break}
  case 'mclose':S.modal=null;break;
  case 'tab':S.tab[S.role]=v;S.hubBack=null;break;
  case 'hub':if(S.tab[S.role]!=='hub'){S.hubBack=S.tab[S.role];S.tab[S.role]='hub'}break;
  case 'hubclose':S.tab[S.role]=S.hubBack||Object.keys(VIEWS[S.role])[0];S.hubBack=null;break;
  case 'switch':if(S.role!=='fleet')return;S.role=v;S.tab[v]=Object.keys(VIEWS[v])[0];S.hubBack=null;toast(T('وضع المعاينة','Preview mode'));return;
  case 'goreq':if(S.mode==='web'){S.portal='fleet';S.wtab.fleet='requests'}else S.tab.fleet='requests';S.reqFilter='pending';break;
  case 'regen':newToken();break;
  case 'snap':toast(T('تم إرفاق صورة لوحة العدّادات','Dashboard photo attached'));return;
  case 'odo':{const val=(($('#odo')||{}).value||'').trim();if(!/^\d{3,7}$/.test(val)){toast(T('أدخل قراءة عدّاد صحيحة بالأرقام','Enter a valid odometer reading in digits'));return}S.odo={val,done:true};newToken();toast(T('تم حفظ القراءة وتفعيل التصريح','Reading saved and pass activated'));return}
  case 'pay':if(S.role==='driver')openPay();return;
  case 'newreq':openReq(v);return;
  case 'rqtype':S.rq.type=v;S.rq.reason=v==='activate'?'review':'trip';break;
  case 'rqamt':S.rq.amount=+v;break;
  case 'rqsend':sendReq();return;
  case 'rqok':decide(v,true);return;
  case 'rqno':decide(v,false);return;
  case 'rqf':S.reqFilter=v;break;
  case 'toast':toast(v);return;
  case 'reactivate':fv(v).active=true;toast(T('تمت إعادة تفعيل المركبة','Vehicle reactivated'));return;
  case 'denable':drv(v).active=true;toast(T('تمت إعادة تفعيل السائق','Driver reactivated'));return;
  case 'raise':{const f=fv(v);f.extra=(f.extra||0)+300000;toast(T(`تمت إضافة 300,000 ج.س إلى حد هذا الشهر`,`SDG 300,000 added to this month's limit`));return}
  case 'st':F.station=v;F.pump=null;break;
  case 'pp':F.pump=+v;break;
  case 'fu':F.fuel=v;F.pump=null;break;
  case 'am':{const {cap}=capFor(myVeh());F.amount=v==='full'?Math.max(10000,Math.floor(Math.min(cap,400000)/1000)*1000):+v;break}
  case 'next':F.step++;break;
  case 'back':F.step--;break;
  case 'confirm':confirmPay();return;
  case 'close':{const done=S.sheet==='pay'&&F&&F.step===5;S.sheet=null;if(done){toast(T('حُفظ الإيصال في السجل','Receipt saved to History'));return}break}
  case 'scanqr':doScan('qr');return;
  case 'scanrfid':doScan('rfid');return;
  case 'sclear':S.scan=null;break;
  case 'spump':S.scan.pump=+v;break;
  case 'smode':S.scan.mode=v;break;
  case 'sval':if(S.scan.mode==='lit')S.scan.lit=+v;else S.scan.sar=+v;break;
  case 'dispense':doDispense();return;
  case 'start':{const t=S.tx.find(x=>x.id===v);t.status='fueling';toast(T(`تم تشغيل المضخة ${t.pump}`,`Pump ${t.pump} started`));return}
  case 'finish':{const t=S.tx.find(x=>x.id===v),hm=nowHM();t.status='done';t.when=W('اليوم '+hm,'Today '+hm);toast(T(`اكتملت العملية · إيصال ${t.id}`,`Completed · receipt ${t.id}`));return}
  case 'key':{
   if(v==='C')S.keyCode='';
   else if(v==='OK'){const t=S.tx.find(x=>x.code===S.keyCode&&x.status==='auth'&&x.station===MY);S.keyCode='';
    if(t){t.status='fueling';toast(T(`الرمز صحيح · بدأ التشغيل على المضخة ${t.pump}`,`Code accepted · pump ${t.pump} started`));return}
    toast(T('لا توجد عملية مفتوحة بهذا الرمز. اطلب من السائق التحقق من التطبيق.','No open authorization matches this code. Ask the driver to check the app.'));return}
   else if(S.keyCode.length<4)S.keyCode+=v;
   break}
 }
 render();
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='amt'){const F=S.flow;F.amount=+el.value||0;
  const {cap,why}=capFor(myVeh()),over=F.amount>cap;
  $('#calc').innerHTML=`≈ <span class="num">${liters(F.amount,F.fuel).toFixed(1)}</span> ${T('لتر','litres')}`;
  const m=$('#capmsg');m.textContent=capMsg(over,cap,why);m.style.color=over?'var(--rd)':'var(--muted)';
  $('#amtnext').disabled=over||F.amount<10000;}
 if(el.id==='rqamt'){S.rq.amount=+el.value||0;const b=$('#rqsend'),dup=myReqs().some(r=>r.status==='pending'&&r.type===S.rq.type);if(b)b.disabled=dup||!(S.rq.amount>=10000&&S.rq.amount<=2000000)}
 if(el.id==='rqnote')S.rq.note=el.value;
 if(el.id==='odo')S.odo.val=el.value;
 if(el.id==='txq'){S.txFilter.q=el.value;$('#txbody').innerHTML=filteredFleetTx()}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.closest('#mform'))return;
 if(el.id==='rqreason'){S.rq.reason=el.value;return}
 if(el.dataset.wtier){const f=fv(el.dataset.wtier);f.tier=el.value||null;const t=tierOf(f);toast(t?T(`نُقلت المركبة إلى فئة ${t.name.ar} · الحد ${curTxt(limOf(f))}`,`Vehicle moved to ${t.name.en} · limit ${curTxt(limOf(f))}`):T('أُزيلت المركبة من الفئة','Vehicle removed from its tier'));return}
 if(el.dataset.active){const f=fv(el.dataset.active);f.active=el.checked;toast(f.active?T('تمت إعادة تفعيل المركبة','Vehicle reactivated'):T('تم إيقاف المركبة ولن يتمكن سائقها من التعبئة','Vehicle suspended; its driver can no longer fuel'));return}
 if(el.dataset.denable){const d=drv(el.dataset.denable);d.active=el.checked;toast(d.active?T(`تمت إعادة تفعيل ${d.name.ar}`,`${d.name.en} reactivated`):T(`تم إيقاف ${d.name.ar} وإقفال تصريح الوقود`,`${d.name.en} suspended and fuel pass locked`));return}
 if(el.dataset.son){const s=S.staff.find(x=>x.id===el.dataset.son);s.on=el.checked;toast(s.on?T('تم تفعيل حساب الموظف','Staff account activated'):T('تم إيقاف حساب الموظف','Staff account suspended'));return}
 if(el.dataset.rule){S.rules[el.dataset.rule]=el.checked;toast(T('تم تحديث القاعدة في جميع التطبيقات','Rule updated across all apps'));return}
 if(el.hasAttribute('data-maxamt')){S.rules.maxFillAmt=Math.max(10000,+el.value||400000);toast(T(`الحد الأقصى للتعبئة الواحدة ${curTxt(S.rules.maxFillAmt)}`,`Maximum per fill-up set to ${curTxt(S.rules.maxFillAmt)}`));return}
 if(el.dataset.pump){const p=pumpOf(+el.dataset.pump);p.on=el.checked;toast(p.on?T(`المضخة ${p.n} تعمل الآن`,`Pump ${p.n} is back online`):T(`تم إيقاف المضخة ${p.n}`,`Pump ${p.n} taken offline`));return}
 if(el.dataset.vat){if(el.dataset.vat==='on'){S.tax.on=el.checked;toast(S.tax.on?T(`تم تفعيل الضريبة بنسبة ${S.tax.rate}%`,`VAT turned on at ${S.tax.rate}%`):T('تم إيقاف الضريبة','VAT turned off'))}else{const r=+el.value;if(el.value===''||!(r>=0&&r<=100)){toast(T('أدخل نسبة بين 0 و 100','Enter a rate between 0 and 100'));return}S.tax.rate=r;toast(T(`نسبة الضريبة ${r}%`,`VAT rate set to ${r}%`))}return}
 if(el.dataset.set){const k=el.dataset.set,val=el.value.trim();if(!val){toast(T('لا يمكن ترك هذا الحقل فارغاً','This field cannot be empty'));return}
  if(k.startsWith('org.'))S.org[k.slice(4)]=val;else{const s=stn(MY),path=k.slice(3).split('.');if(path.length===2)s[path[0]][path[1]]=val;else s[path[0]]=val}
  toast(T('تم الحفظ','Saved'));return}
 if(el.id==='txf'){S.txFilter.fuel=el.value;$('#txbody').innerHTML=filteredFleetTx()}
});
document.addEventListener('submit',e=>{if(e.target.id==='mform'){e.preventDefault();saveModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.sheet)){S.modal=null;S.sheet=null;render()}});
render();
</script>
