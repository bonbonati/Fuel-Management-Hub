# Production. Differences from dev:
#  - no in-cluster infra: Postgres / RabbitMQ / Valkey are managed services
#    reached through the URLs in the "petro-secrets" Secret;
#  - the Secret is NOT generated here. Create it from a secret manager
#    (External Secrets Operator, Sealed Secrets, SOPS…) with the keys in
#    secrets.example.env — including a persistent AUTH signing key;
#  - demo mode and demo seeding off (base defaults);
#  - images: the CD workflow (.github/workflows/cd.yml) rewrites the images
#    block below on every push to main (registry from the REGISTRY variable,
#    tag = commit SHA) and commits it; Argo CD syncs from here;
#  - 2+ replicas with HPAs, larger resources, TLS ingress on a real host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petro

resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml

images:
  - { name: petro/auth, newName: registry.example.com/petro/auth, newTag: not-yet-built }
  - { name: petro/fleet, newName: registry.example.com/petro/fleet, newTag: not-yet-built }
  - { name: petro/station, newName: registry.example.com/petro/station, newTag: not-yet-built }
  - { name: petro/payment, newName: registry.example.com/petro/payment, newTag: not-yet-built }
  - { name: petro/fueling, newName: registry.example.com/petro/fueling, newTag: not-yet-built }
  - { name: petro/web, newName: registry.example.com/petro/web, newTag: not-yet-built }

patches:
  # Two replicas minimum (the HPA scales further) and production resources.
  - target: { kind: Deployment, labelSelector: app.kubernetes.io/component=api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 200m, memory: 64Mi }, limits: { memory: 256Mi } }
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # Public host and TLS (cert-manager issuer name is an example).
  - target: { kind: Ingress, name: petro }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { cert-manager.io/cluster-issuer: letsencrypt }
      - op: add
        path: /spec/tls
        value: [{ hosts: [petro.example.com], secretName: petro-tls }]
      - op: add
        path: /spec/rules/0/host
        value: petro.example.com
