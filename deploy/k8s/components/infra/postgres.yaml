# Single Postgres 18 instance hosting one database + owner role per service
# (created on first start by init-databases.sh).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: postgres-password } } }
            - { name: AUTH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: auth-db-password } } }
            - { name: FLEET_DB_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: fleet-db-password } } }
            - { name: STATION_DB_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: station-db-password } } }
            - { name: PAYMENT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: payment-db-password } } }
            - { name: FUELING_DB_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: fueling-db-password } } }
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres, -d, postgres] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres, -d, postgres] }
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
