# Valkey holds only ephemeral data (pass tokens, scan sessions, login
# throttling), so it runs without persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/component: cache }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/component: cache }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:9.0.7-alpine3.24
          args: ["--requirepass", "$(VALKEY_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - { name: VALKEY_PASSWORD, valueFrom: { secretKeyRef: { name: petro-secrets, key: valkey-password } } }
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            tcpSocket: { port: valkey }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: { app.kubernetes.io/name: valkey }
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
