# station service — Stations, pumps, staff, fuel prices.
# Stateless; scale horizontally. Runs migrations on start (advisory-locked).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: station
  labels: { app.kubernetes.io/name: station, app.kubernetes.io/component: api }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: station }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: station, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: station
          image: petro/station
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: LOG_LEVEL, valueFrom: { configMapKeyRef: { name: petro-config, key: LOG_LEVEL } } }
            - { name: AUTH_JWKS_URL, valueFrom: { configMapKeyRef: { name: petro-config, key: AUTH_JWKS_URL } } }
            - { name: SEED_DEMO_DATA, valueFrom: { configMapKeyRef: { name: petro-config, key: SEED_DEMO_DATA } } }
            - { name: CORS_ALLOWED_ORIGINS, valueFrom: { configMapKeyRef: { name: petro-config, key: CORS_ALLOWED_ORIGINS } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: petro-secrets, key: station-database-url } } }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: station
  labels: { app.kubernetes.io/name: station }
spec:
  selector: { app.kubernetes.io/name: station }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: station
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: station }
