# Pods only accept traffic from pods in the same namespace and from the
# ingress controller's namespace (k3s ships Traefik in kube-system; Traefik
# or ingress-nginx installed by Helm usually live in their own namespace).
# Add your controller's namespace here if it differs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: petro-same-namespace-and-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [kube-system, traefik, ingress-nginx]
