# PetroFleet application workloads. Infrastructure (Postgres, Valkey,
# RabbitMQ) is NOT included: add components/infra (dev, self-hosted) or point
# the secrets at managed services (prod).
#
# Expects a Secret "petro-secrets" with the keys listed in
# overlays/prod/secrets.example.env (the dev overlay generates one).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs: { app.kubernetes.io/part-of: petro }
    includeSelectors: false

resources:
  - auth.yaml
  - fleet.yaml
  - station.yaml
  - payment.yaml
  - fueling.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: petro-config
    literals:
      - LOG_LEVEL=info
      - AUTH_JWKS_URL=http://auth:8080/.well-known/jwks.json
      - FLEET_URL=http://fleet:8080
      - STATION_URL=http://station:8080
      - PAYMENT_URL=http://payment:8080
      - VALKEY_ADDR=valkey:6379
      - ACCESS_TOKEN_TTL=8h
      - SETTLEMENT_FEE_BPS=43
      - CORS_ALLOWED_ORIGINS=capacitor://localhost,https://localhost
      # Safe production defaults; the dev overlay turns the demo on.
      - DEMO_MODE=false
      - SEED_DEMO_DATA=false
      - AUTH_ALLOW_EPHEMERAL_KEY=false

images:
  - { name: petro/auth, newTag: dev }
  - { name: petro/fleet, newTag: dev }
  - { name: petro/station, newTag: dev }
  - { name: petro/payment, newTag: dev }
  - { name: petro/fueling, newTag: dev }
  - { name: petro/web, newTag: dev }
