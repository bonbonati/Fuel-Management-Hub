# PetroFleet Sudan — local environment.
#
#   docker compose up --build -d      # build and start everything
#   open http://localhost:8080        # web admin (fleet + station portals)
#
# The mobile app (frontend/apps/mobile) is a planned stage and not part of the stack yet.
#
# Other endpoints: Traefik dashboard http://localhost:8090,
# RabbitMQ console http://localhost:15672 (petro / petro-dev), Postgres localhost:55432.
#
# All credentials and host ports below are development defaults; override them
# in a .env file (see .env.example). Full guide: docs/local-setup.md. Demo accounts all use DEMO_PASSWORD (default demo1234).

name: petro

x-go-service: &go-service
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres: { condition: service_healthy }
  # Healthcheck is defined in the image (`/service healthcheck`).

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-capacitor://localhost,https://localhost,http://localhost:5173,http://localhost:5174}

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth-dev}
      FLEET_DB_PASSWORD: ${FLEET_DB_PASSWORD:-fleet-dev}
      STATION_DB_PASSWORD: ${STATION_DB_PASSWORD:-station-dev}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment-dev}
      FUELING_DB_PASSWORD: ${FUELING_DB_PASSWORD:-fueling-dev}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/k8s/components/infra/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  valkey:
    image: valkey/valkey:9.0.7-alpine3.24
    restart: unless-stopped
    # Ephemeral data only (pass tokens, scan sessions, rate limits): no persistence.
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-valkey-dev}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey-dev}
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    restart: unless-stopped
    hostname: rabbitmq # the node name (and its data) is tied to the hostname
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-petro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-petro-dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports: ["127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  # ---------------------------------------------------------------- services
  auth:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: auth } }
    image: petro/auth:dev
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD:-auth-dev}@postgres:5432/auth?sslmode=disable
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey-dev}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-8h}
      # A real key may be supplied via AUTH_SIGNING_KEY (PEM). Without one, a
      # throwaway key is generated at start-up (sessions end when auth restarts).
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      AUTH_ALLOW_EPHEMERAL_KEY: "true"

  fleet:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: fleet } }
    image: petro/fleet:dev
    environment:
      <<: *common-env
      DATABASE_URL: postgres://fleet:${FLEET_DB_PASSWORD:-fleet-dev}@postgres:5432/fleet?sslmode=disable

  station:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: station } }
    image: petro/station:dev
    environment:
      <<: *common-env
      DATABASE_URL: postgres://station:${STATION_DB_PASSWORD:-station-dev}@postgres:5432/station?sslmode=disable

  payment:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: payment } }
    image: petro/payment:dev
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD:-payment-dev}@postgres:5432/payment?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_USER:-petro}:${RABBITMQ_PASSWORD:-petro-dev}@rabbitmq:5672/
      SETTLEMENT_FEE_BPS: "43"

  fueling:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: fueling } }
    image: petro/fueling:dev
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgres://fueling:${FUELING_DB_PASSWORD:-fueling-dev}@postgres:5432/fueling?sslmode=disable
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey-dev}
      AMQP_URL: amqp://${RABBITMQ_USER:-petro}:${RABBITMQ_PASSWORD:-petro-dev}@rabbitmq:5672/
      FLEET_URL: http://fleet:8080
      STATION_URL: http://station:8080
      PAYMENT_URL: http://payment:8080

  # ---------------------------------------------------------------- frontends
  web:
    build: { context: ./frontend, dockerfile: apps/web/Dockerfile }
    image: petro/web:dev
    restart: unless-stopped
    networks: [backend]

  # ---------------------------------------------------------------- gateway
  gateway:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.dashboard=true
      - --api.insecure=true # dashboard on :8080 inside the container (dev only)
      - --accesslog=true
      - --ping=true
    volumes:
      - ./deploy/compose/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on: [auth, fleet, station, payment, fueling, web]
    networks: [backend]

networks:
  backend: {}

volumes:
  postgres-data: {}
  rabbitmq-data: {}
