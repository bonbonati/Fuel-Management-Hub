# Static hosting of the web admin SPA (runs as non-root on :8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # API paths belong to the gateway; never answer them with the SPA shell.
    location /api/      { return 404; }
    location /internal/ { return 404; }

    # Fingerprinted build assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other path serves index.html (never cached, so deploys apply at once).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
